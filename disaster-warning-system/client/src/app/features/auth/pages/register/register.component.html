<div class="min-h-screen bg-[#0b1528] relative overflow-hidden flex flex-col justify-center items-center py-10 px-4 sm:px-6 lg:px-8 font-sans selection:bg-orange-500 selection:text-white">
  
  <!-- Ambient Background Glow Accents -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-blue-600/15 rounded-full blur-[130px] pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-[450px] h-[450px] bg-orange-500/10 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="absolute top-10 left-10 w-[350px] h-[350px] bg-indigo-500/10 rounded-full blur-[90px] pointer-events-none"></div>

  <!-- Main Register Card Container -->
  <div class="max-w-xl w-full bg-slate-900/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-blue-500/20 p-8 space-y-6 relative z-10 transition-all duration-300 overflow-hidden">
    
    <!-- Top Decorative Gradient Glow Bar -->
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-600 via-indigo-500 to-orange-500"></div>

    <!-- Top Shield Icon -->
    <div class="flex justify-center pt-1">
      <div class="w-16 h-16 bg-blue-500/10 border border-blue-500/30 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/10 group hover:scale-105 transition-transform">
        <svg class="w-9 h-9 text-blue-400 group-hover:text-orange-400 transition-colors" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="text-center space-y-1">
      <h2 class="text-3xl font-black text-white tracking-tight flex items-center justify-center gap-2">
        Portal Registration
      </h2>
      <p class="text-xs text-slate-400">Create an authenticated account for national disaster coordination.</p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="bg-red-950/80 border border-red-500/50 text-red-200 px-4 py-3 rounded-xl text-sm flex items-center gap-2.5 shadow-lg shadow-red-950/50 animate-fade-in">
      <svg class="w-5 h-5 text-red-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
      </svg>
      <span class="text-xs font-medium">{{ errorMessage }}</span>
    </div>

    <!-- Registration Form -->
    <form (ngSubmit)="onRegister()" class="space-y-4">
      
      <!-- Role Selection -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300">Select Account Role *</label>
        <div class="relative">
          <select 
            [(ngModel)]="selectedRole" 
            name="selectedRole" 
            class="w-full bg-slate-950/80 border border-slate-700/70 text-slate-100 text-sm rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3.5 pr-10 appearance-none font-medium shadow-inner"
          >
            <option value="CITIZEN" class="bg-slate-900 text-slate-100">👤 Citizen / Public User</option>
            <option value="RESCUE_TEAM" class="bg-slate-900 text-slate-100">🚑 Rescue Team (Full Unit Registration)</option>
            <option value="DUTY_OFFICER" class="bg-slate-900 text-slate-100">👮 Duty Officer (Field Verification)</option>
            <option value="DMC_OFFICER" class="bg-slate-900 text-slate-100">🏢 DMC Officer (National Command)</option>
            <option value="DISTRICT_OFFICER" class="bg-slate-900 text-slate-100">🏛️ District Officer (Regional Coordinator)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- General Name Field -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-slate-300">
          <span *ngIf="selectedRole !== 'RESCUE_TEAM'">Full Name *</span>
          <span *ngIf="selectedRole === 'RESCUE_TEAM'">Rescue Team Unit Name *</span>
        </label>
        <input 
          type="text" 
          [(ngModel)]="name" 
          name="name" 
          [placeholder]="selectedRole === 'RESCUE_TEAM' ? 'e.g. Sri Lanka Navy Water Rescue Unit 2' : 'e.g. Asheni Imalsha'"
          required 
          class="w-full bg-slate-950/80 border border-slate-700/70 text-slate-100 text-sm rounded-xl p-3.5 focus:ring-2 focus:ring-blue-500 placeholder:text-slate-500 shadow-inner"
        >
      </div>

      <!-- Email & Password -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Email Address *</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="user@domain.com" 
            required 
            class="w-full bg-slate-950/80 border border-slate-700/70 text-slate-100 text-sm rounded-xl p-3.5 focus:ring-2 focus:ring-blue-500 placeholder:text-slate-500 shadow-inner"
          >
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Password *</label>
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="Min 6 chars" 
            required 
            class="w-full bg-slate-950/80 border border-slate-700/70 text-slate-100 text-sm rounded-xl p-3.5 focus:ring-2 focus:ring-blue-500 placeholder:text-slate-500 shadow-inner"
          >
        </div>
      </div>

      <!-- District & Phone -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Operating District *</label>
          <div class="relative">
            <select 
              [(ngModel)]="district" 
              name="district" 
              class="w-full bg-slate-950/80 border border-slate-700/70 text-slate-100 text-sm rounded-xl p-3.5 pr-10 appearance-none font-medium focus:ring-2 focus:ring-blue-500 shadow-inner"
            >
              <option *ngFor="let d of districts" [value]="d" class="bg-slate-900 text-slate-100">{{ d }}</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3.5 text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="space-y-1.5">
          <label class="block text-xs font-semibold text-slate-300">Phone Number</label>
          <input 
            type="text" 
            [(ngModel)]="phone" 
            name="phone" 
            placeholder="0771234567" 
            class="w-full bg-slate-950/80 border border-slate-700/70 text-slate-100 text-sm rounded-xl p-3.5 focus:ring-2 focus:ring-blue-500 placeholder:text-slate-500 shadow-inner"
          >
        </div>
      </div>

      <!-- Officer Specific Badge ID -->
      <div *ngIf="['DUTY_OFFICER', 'DMC_OFFICER', 'DISTRICT_OFFICER'].includes(selectedRole)" class="space-y-1.5 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800">
        <label class="block text-xs font-semibold text-slate-300">Official Badge ID / Service Number</label>
        <input 
          type="text" 
          [(ngModel)]="badgeId" 
          name="badgeId" 
          placeholder="e.g. DMC-OFF-101" 
          class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg p-2.5 placeholder:text-slate-500 focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- RESCUE TEAM SPECIFIC FIELDS -->
      <div *ngIf="selectedRole === 'RESCUE_TEAM'" class="space-y-3 bg-blue-950/40 p-4 rounded-xl border border-blue-500/20 shadow-inner">
        <h4 class="text-xs font-bold text-blue-300 uppercase tracking-wider flex items-center gap-1.5">
          <span>🚑</span> Rescue Unit Parameters
        </h4>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-blue-200 mb-1">Organization</label>
            <input 
              type="text" 
              [(ngModel)]="organization" 
              name="organization" 
              placeholder="e.g. Sri Lanka Navy" 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg p-2.5 placeholder:text-slate-500 focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div>
            <label class="block text-xs font-semibold text-blue-200 mb-1">Team Rescue Type</label>
            <select 
              [(ngModel)]="teamType" 
              name="teamType" 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500"
            >
              <option value="WATER_RESCUE" class="bg-slate-900 text-slate-100">Water Rescue</option>
              <option value="SEARCH_AND_RESCUE" class="bg-slate-900 text-slate-100">Search & Rescue</option>
              <option value="MEDICAL" class="bg-slate-900 text-slate-100">Medical Emergency</option>
              <option value="FIRE" class="bg-slate-900 text-slate-100">Fire Response</option>
              <option value="EVACUATION" class="bg-slate-900 text-slate-100">Evacuation Unit</option>
              <option value="GENERAL" class="bg-slate-900 text-slate-100">General Rescue</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-blue-200 mb-1">Personnel Count</label>
            <input 
              type="number" 
              [(ngModel)]="membersCount" 
              name="membersCount" 
              min="1" 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div>
            <label class="block text-xs font-semibold text-blue-200 mb-1">Base Lat</label>
            <input 
              type="number" 
              [(ngModel)]="latitude" 
              name="latitude" 
              step="0.0001" 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500"
            >
          </div>
          <div>
            <label class="block text-xs font-semibold text-blue-200 mb-1">Base Lon</label>
            <input 
              type="number" 
              [(ngModel)]="longitude" 
              name="longitude" 
              step="0.0001" 
              class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500"
            >
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full bg-gradient-to-r from-blue-600 via-blue-700 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 hover:shadow-blue-500/50 btn-interactive transition-all duration-200 flex justify-center items-center gap-2 disabled:opacity-50 text-base border border-blue-400/20"
      >
        <span *ngIf="!isLoading">Register Account ➔</span>
        <span *ngIf="isLoading" class="flex items-center gap-2">
          <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Processing Registration...
        </span>
      </button>

    </form>

    <!-- Switch to Login -->
    <div class="text-center text-sm text-slate-400">
      Already have an account? 
      <a routerLink="/login" class="text-blue-400 hover:text-blue-300 font-bold hover:underline ml-1">Sign In Here</a>
    </div>

  </div>

  <!-- Bottom Official Emergency Footer -->
  <div class="mt-8 text-center text-xs font-semibold text-slate-400 tracking-wide relative z-10">
    OFFICIAL SERVICE: 
    <span class="text-orange-400 font-bold">National 117</span> • 
    <span class="text-blue-400 font-bold">Suwa Seriya 1990</span> • 
    <span class="text-emerald-400 font-bold">Police 119</span>
  </div>

</div>
