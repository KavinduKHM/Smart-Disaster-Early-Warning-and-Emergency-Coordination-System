<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
  <!-- Background glowing accents -->
  <div class="absolute top-10 left-10 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full space-y-8 bg-slate-800/90 backdrop-blur-md p-8 rounded-2xl border border-slate-700 shadow-2xl z-10">
    <!-- Header Logo & Title -->
    <div class="text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-red-600 to-orange-500 text-white shadow-lg shadow-red-500/30 mb-4">
        <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Disaster Warning System</h2>
      <p class="text-sm text-slate-400 mt-1">DMC Early Warning & Emergency Control Portal</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Officer Email</label>
          <div class="relative">
            <input
              type="email"
              formControlName="email"
              placeholder="officer@dmc.lk"
              class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all text-sm"
              [ngClass]="{ 'border-red-500': submitted && f['email'].errors }"
            />
          </div>
          <div *ngIf="submitted && f['email'].errors" class="text-red-400 text-xs mt-1">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Enter a valid email address</span>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all text-sm"
              [ngClass]="{ 'border-red-500': submitted && f['password'].errors }"
            />
          </div>
          <div *ngIf="submitted && f['password'].errors" class="text-red-400 text-xs mt-1">
            Password must be at least 6 characters
          </div>
        </div>
      </div>

      <div>
        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-3 px-4 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 hover:to-red-600 text-white font-semibold rounded-xl shadow-lg shadow-red-600/30 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 focus:ring-offset-slate-900 transition-all disabled:opacity-50 flex items-center justify-center space-x-2 text-sm"
        >
          <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ loading ? 'Authenticating...' : 'Sign In to Control Center' }}</span>
        </button>
      </div>
    </form>

    <!-- Quick Role Switcher for Demo -->
    <div class="pt-6 border-t border-slate-700/60 text-center">
      <p class="text-xs text-slate-400 mb-3">Quick Demo Login Presets:</p>
      <div class="flex flex-wrap justify-center gap-2">
        <button
          (click)="fillQuickLogin('dmc@disaster.lk')"
          class="px-3 py-1.5 text-xs bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-600 transition-all"
        >
          DMC Officer
        </button>
        <button
          (click)="fillQuickLogin('admin@disaster.lk')"
          class="px-3 py-1.5 text-xs bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-600 transition-all"
        >
          Admin
        </button>
        <button
          (click)="fillQuickLogin('citizen@disaster.lk')"
          class="px-3 py-1.5 text-xs bg-slate-700/60 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-600 transition-all"
        >
          Citizen
        </button>
      </div>
    </div>
  </div>
</div>
